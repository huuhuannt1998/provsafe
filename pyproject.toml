[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provsafe"
version = "0.1.0"
description = "PROVSAFE: Tool-Call Policy Enforcement Proxy with Provenance Logging and Prompt Injection Benchmark"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Research Team", email = "research@provsafe.dev"}
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "networkx>=3.0",
    "pytest>=7.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
"evaluation/*.py" = ["E402"]
